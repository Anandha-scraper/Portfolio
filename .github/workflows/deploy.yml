name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static production site
        run: npm run build

      - name: Verify production output excludes development tooling
        run: |
          test -f out/index.html
          test ! -e out/master
          ! find out -type f -path '*/master/*' -print -quit | grep -q .

      - name: Deploy Firebase Hosting production site
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: anandhadev
